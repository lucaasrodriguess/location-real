<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Rastreamento em Tempo Real</title>

    <!-- Bibliotecas -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: Arial, sans-serif;
      }
      #map {
        height: 100%;
        width: 100%;
        display: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        color: #333;
        background: #f5f5f5;
        z-index: 10;
        flex-direction: column;
      }
      .info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 10px 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        z-index: 999;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
        color: gray;
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div>🛰️ Carregando localização inicial...</div>
      <div class="status" id="status"></div>
    </div>

    <div id="map"></div>

    <!-- ✅ Adicionado id="userId" (corrige o erro) -->
    <div class="info">
      <strong>Usuário:</strong> <span id="userId"></span><br />
      <small>Última atualização: <span id="updatedAt">--</span></small>
    </div>

    <script>
      const SERVER_URL = "https://wilful-emlyn-safeher-41c63af9.koyeb.app";

      // Captura o userId da URL (ex: /track/123)
      const userId = window.location.pathname.split("/").pop();
      document.getElementById("userId").textContent = userId;

      let map, marker;
      const loading = document.getElementById("loading");
      const statusText = document.getElementById("status");
      const updatedAtText = document.getElementById("updatedAt");

      const socket = io(SERVER_URL, {
        transports: ["websocket"],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 2000,
      });

      socket.on("connect", () => {
        statusText.textContent = "🟢 Conectado";
      });

      socket.on("disconnect", () => {
        statusText.textContent = "🔴 Desconectado... tentando reconectar";
      });

      socket.on("connect_error", (err) => {
        statusText.textContent = "⚠️ Erro de conexão";
        console.log("Erro de conexão:", err.message);
      });

      function initMap(lat, lng) {
        loading.style.display = "none";
        document.getElementById("map").style.display = "block";

        map = L.map("map").setView([lat, lng], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
        }).addTo(map);

        marker = L.marker([lat, lng]).addTo(map);
      }

      // Busca localização inicial
      fetch(`${SERVER_URL}/api/location/${userId}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.latitude && data.longitude) {
            initMap(data.latitude, data.longitude);
            updatedAtText.textContent = new Date(data.updatedAt).toLocaleTimeString();
          } else {
            loading.innerHTML = "⏳ Aguardando primeira localização...";
          }
        })
        .catch(() => {
          loading.innerHTML = "❌ Erro ao carregar localização inicial.";
        });

      // Atualizações em tempo real
      socket.on(`locationUpdate-${userId}`, (data) => {
        const { latitude, longitude, updatedAt } = data;

        if (!map) {
          initMap(latitude, longitude);
        } else {
          marker.setLatLng([latitude, longitude]);
          map.panTo([latitude, longitude]);
        }

        updatedAtText.textContent = new Date(updatedAt).toLocaleTimeString();
      });
    </script>
  </body>
</html>
